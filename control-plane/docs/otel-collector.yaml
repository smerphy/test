# Example OpenTelemetry Collector config for the Ephorate collector tier.
#
# Agents (or an OTLP instrumentation lib) send LLM-call telemetry to a nearby
# collector over localhost; the collector batches + retries + fans out and
# exports OTLP/HTTP to Ephorate's /otlp/v1/metrics endpoint. This offloads
# buffering/backpressure from every agent and gives one choke point per node.
#
# Ephorate consumes metrics named `ephorate.llm.call` (or
# `gen_ai.client.operation.duration`) whose data points carry GenAI
# semantic-convention attributes; see app/services/otlp.py for the mapping.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch to amortize round-trips to the control plane.
  batch:
    send_batch_size: 512
    timeout: 5s
  # Cap memory so a downstream stall can't OOM the collector.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  otlphttp/ephorate:
    # Ephorate exposes OTLP/HTTP for metrics at this path.
    metrics_endpoint: https://ephorate.example.com/otlp/v1/metrics
    headers:
      # Scope the export to one org + authenticate like any SDK client.
      X-API-Key: ${env:EPHORATE_API_KEY}
      X-Org-Slug: ${env:EPHORATE_ORG_SLUG}
    # The collector already buffers + retries; Ephorate is idempotent per call.
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/ephorate]
