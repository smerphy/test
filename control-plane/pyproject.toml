[project]
name = "ephorate-control-plane"
version = "0.1.0"
description = "Ephorate control plane: policy authoring, audit storage, approvals, compliance reports."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ephorate" }]
dependencies = [
    "ephorate-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pydantic>=2.6",
    "psycopg[binary]>=3.2",
    "structlog>=24.0",
    "prometheus-client>=0.20",
    "reportlab>=4.2",
    "celery[redis]>=5.4",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.uv.sources]
ephorate-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "celery.*",
    "reportlab.*",
    "authlib.*",
    "confluent_kafka.*",
    "clickhouse_connect.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.workers.tasks"
disable_error_code = ["untyped-decorator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"alembic/*" = ["E501"]
# FastAPI dependency injection uses `Depends()` as a default value — that's the idiom.
"app/routers/*" = ["B008"]
"app/auth.py" = ["B008"]
"app/services/ratelimit.py" = ["B008"]
"app/services/access_log.py" = ["B008"]
