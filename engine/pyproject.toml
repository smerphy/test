[project]
name = "praetor-engine"
version = "0.1.0"
description = "Praetor policy engine: declarative runtime policy evaluation for AI agents."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Praetor" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
praetor = "praetor_engine.cli:main"
praetor-engine-schemas = "praetor_engine.schema:_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praetor_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --benchmark-disable"
markers = [
    "benchmark: pytest-benchmark marker; disabled by default, opt in with --benchmark-enable",
]

[tool.coverage.run]
source = ["praetor_engine"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["praetor_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
