[project]
name = "praetor-engine"
version = "0.1.0"
description = "Praetor policy engine: declarative runtime policy evaluation for AI agents."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Praetor" }]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praetor_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["praetor_engine"]
