name: sdk-python

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: sdk-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Sync dependencies
        working-directory: .
        run: uv sync --package praetor --extra dev

      - name: Ruff
        run: uv run ruff check praetor tests

      - name: Mypy (strict)
        run: uv run mypy praetor

      - name: Pytest with coverage gate (>=90%)
        run: uv run pytest --cov=praetor --cov-report=term-missing --cov-fail-under=90
