name: engine

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Sync dependencies
        working-directory: .
        run: uv sync --package praetor-engine --extra dev

      - name: Ruff
        run: uv run ruff check praetor_engine tests

      - name: Mypy (strict)
        run: uv run mypy praetor_engine

      - name: Pytest with coverage gate (>=85%)
        run: uv run pytest --cov=praetor_engine --cov-report=term-missing --cov-fail-under=85
