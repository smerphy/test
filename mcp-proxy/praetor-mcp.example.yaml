# Praetor MCP proxy config. Run: praetor-mcp --config praetor-mcp.yaml
# Validate without the MCP runtime: praetor-mcp --check --config praetor-mcp.yaml

control_plane:
  url: https://praetor.example.com
  api_key: ${PRAETOR_API_KEY}     # expand via your process env / secret manager
  org_slug: acme

policy:
  bundle_path: ./policies.yaml     # Praetor policy bundle the gate evaluates

agent:
  id: research-agent-1             # attributed on the audit chain

enforcement:
  on_error: deny                   # fail-closed (security default) | allow
  approval_timeout_seconds: 300
  hide_denied_tools: true          # drop policy-denied tools from tools/list

audit_log_path: ./praetor-mcp-audit.jsonl

# One or more upstream MCP servers to police (gateway mode namespaces tools
# as "<name>__<tool>").
upstreams:
  - name: github
    transport: stdio
    command: ["npx", "-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
  - name: filesystem
    transport: stdio
    command: ["mcp-server-filesystem", "/data"]

listen:
  # stdio: sidecar — the agent launches praetor-mcp as its MCP server command.
  # streamable-http: deployment mode — serve an ASGI app; point the agent's MCP
  # client at http://<bind><path>. In a container, bind 0.0.0.0.
  transport: streamable-http
  bind: 127.0.0.1:8090
  path: /mcp
  # Downstream (incoming agent) auth. When set, requests without a matching
  # `Authorization: Bearer <token>` are rejected 401, and each call is
  # attributed to the token's agent_id (per-session identity for the gateway).
  # Omit for the single-agent stdio sidecar. Health probes: GET /healthz, /readyz.
  auth_tokens:
    ${AGENT_A_TOKEN}: research-agent-1
    ${AGENT_B_TOKEN}: ops-agent-1
  # DNS-rebinding protection: restrict Host/Origin for a public endpoint.
  allowed_hosts: ["mcp.example.com"]
  allowed_origins: ["https://app.example.com"]
  # Operational metrics are exposed at GET /metrics (Prometheus text).
