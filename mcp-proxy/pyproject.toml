[project]
name = "ephorate-mcp"
version = "0.1.0"
description = "Ephorate MCP proxy: policy-gate, audit, and control MCP tool calls for any MCP-speaking agent."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ephorate" }]
dependencies = [
    "ephorate",
    "pyyaml>=6",
]

[project.optional-dependencies]
# The MCP transport runtime. The policy/decision core does not need it; only
# the server wiring (ephorate_mcp.server) imports `mcp`, lazily.
runtime = ["mcp>=1.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML",
    # The MCP runtime, so the transport adapter (server.py) is exercised in CI
    # against an in-memory mock upstream — not just validated in staging.
    "mcp>=1.2",
]

[project.scripts]
ephorate-mcp = "ephorate_mcp.__main__:main"

[tool.uv.sources]
ephorate = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ephorate_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["ephorate_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["ephorate_mcp"]

[[tool.mypy.overrides]]
module = ["mcp.*", "yaml"]
ignore_missing_imports = true

# The transport adapter decorates handlers with the untyped low-level MCP
# Server API; it's runtime-only (pragma: no cover) and validated in staging.
[[tool.mypy.overrides]]
module = "ephorate_mcp.server"
disable_error_code = ["untyped-decorator", "no-untyped-call", "misc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
